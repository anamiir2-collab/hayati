<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <title>حياتي — نظّم يومك ببساطة</title>

  <!-- =========================
       Basic Meta
  ========================== -->

  <meta
    name="description"
    content="حياتي — مساعدك الشخصي لتنظيم يومك وحياتك"
  />

  <meta name="application-name" content="حياتي" />

  <meta name="theme-color" content="#0066FF" />

  <!-- =========================
       PWA
  ========================== -->

  <meta name="mobile-web-app-capable" content="yes" />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-title"
    content="حياتي"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  />

  <!-- =========================
       Manifest
  ========================== -->

  <link
    rel="manifest"
    href="./manifest.json"
  />

  <!-- =========================
       Favicon
  ========================== -->

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="./assets/icons/favicon-32.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./assets/icons/icon-192.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="./assets/icons/icon-512.png"
  />

  <!-- =========================
       Apple Icon
  ========================== -->

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./assets/icons/apple-touch-icon.png"
  />

  <!-- =========================
       Microsoft Tile
  ========================== -->

  <meta
    name="msapplication-TileImage"
    content="./assets/icons/icon-192.png"
  />

  <meta
    name="msapplication-TileColor"
    content="#0066FF"
  />

  <!-- =========================
       Fonts
  ========================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- =========================
       CSS
  ========================== -->

  <link
    rel="stylesheet"
    href="./css/style.css"
  />

  <link
    rel="stylesheet"
    href="./css/animations.css"
  />

  <link
    rel="stylesheet"
    href="./css/responsive.css"
  />

</head>

<body>

  <!-- =====================================================
       Splash Screen
  ====================================================== -->

  <div
    id="splash"
    class="splash-screen"
    aria-hidden="false"
  >

    <div class="splash-inner">

      <div class="splash-logo">

        <img
          src="./assets/icons/icon-192.png"
          width="76"
          height="76"
          alt="حياتي"
          draggable="false"
        />

      </div>

      <h1 class="splash-title">
        حياتي
      </h1>

      <p class="splash-subtitle">
        نظّم يومك ببساطة
      </p>

      <div
        class="splash-loader"
        aria-hidden="true"
      >
        <span></span>
      </div>

    </div>

  </div>


  <!-- =====================================================
       Application Shell
  ====================================================== -->

  <div
    id="app"
    class="app-shell"
    hidden
  >

    <!-- Toast -->

    <div
      id="toast-container"
      class="toast-container"
      aria-live="polite"
      aria-atomic="true"
    ></div>


    <!-- Motivational Banner -->

    <div
      id="motiv-banner"
      class="motiv-banner"
      hidden
    ></div>


    <!-- Main Application -->

    <main
      id="view-container"
      class="view-container"
      role="main"
    >
      <!-- Views injected by router.js -->
    </main>


    <!-- Modal -->

    <div
      id="modal-root"
      class="modal-root"
      aria-live="assertive"
    ></div>


    <!-- =================================================
         Bottom Navigation
    ================================================== -->

    <nav
      id="bottom-nav"
      class="bottom-nav"
      aria-label="التنقل الرئيسي"
    >

      <!-- Statistics -->

      <button
        class="nav-item"
        data-route="statistics"
        aria-label="الإحصائيات"
      >

        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          aria-hidden="true"
        >

          <path
            d="M4 19V11M10 19V5M16 19V14M22 19H2"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

        </svg>

        <span>
          الإحصائيات
        </span>

      </button>


      <!-- Calendar -->

      <button
        class="nav-item"
        data-route="calendar"
        aria-label="التقويم"
      >

        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          aria-hidden="true"
        >

          <rect
            x="3"
            y="5"
            width="18"
            height="16"
            rx="3"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
          />

          <path
            d="M3 9h18M8 3v4M16 3v4"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />

        </svg>

        <span>
          التقويم
        </span>

      </button>


      <!-- Home -->

      <button
        class="nav-item nav-home"
        data-route="home"
        aria-label="الرئيسية"
      >

        <span class="nav-home-bubble">

          <svg
            viewBox="0 0 24 24"
            width="26"
            height="26"
            aria-hidden="true"
          >

            <path
              d="M4 11.5L12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"
              stroke="currentColor"
              stroke-width="2"
              fill="none"
              stroke-linejoin="round"
            />

          </svg>

        </span>

        <span class="nav-home-label">
          الرئيسية
        </span>

      </button>


      <!-- Habits -->

      <button
        class="nav-item"
        data-route="habits"
        aria-label="العادات"
      >

        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          aria-hidden="true"
        >

          <path
            d="M5 12l5 5L20 7"
            stroke="currentColor"
            stroke-width="2.4"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <circle
            cx="5"
            cy="12"
            r="2"
            fill="currentColor"
          />

        </svg>

        <span>
          العادات
        </span>

      </button>


      <!-- Settings -->

      <button
        class="nav-item"
        data-route="settings"
        aria-label="الإعدادات"
      >

        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          aria-hidden="true"
        >

          <circle
            cx="12"
            cy="12"
            r="3"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
          />

          <path
            d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.2a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1A2 2 0 1 1 4.4 17l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.2a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1A2 2 0 1 1 7 4.4l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.2a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.2a1.6 1.6 0 0 0-1.5 1z"
            stroke="currentColor"
            stroke-width="1.6"
            fill="none"
          />

        </svg>

        <span>
          الإعدادات
        </span>

      </button>

    </nav>

  </div>


  <!-- =====================================================
       JavaScript
  ====================================================== -->

  <script src="./js/storage.js"></script>
  <script src="./js/router.js"></script>
  <script src="./js/notifications.js"></script>
  <script src="./js/tasks.js"></script>
  <script src="./js/habits.js"></script>
  <script src="./js/reminders.js"></script>
  <script src="./js/calendar.js"></script>
  <script src="./js/statistics.js"></script>
  <script src="./js/app.js"></script>


  <!-- =====================================================
       Service Worker Registration
  ====================================================== -->

  <script>
    if ("serviceWorker" in navigator) {

      window.addEventListener("load", async () => {

        try {

          const registration =
            await navigator.serviceWorker.register(
              "./service-worker.js",
              {
                scope: "./"
              }
            );

          console.log(
            "حياتي: Service Worker registered",
            registration.scope
          );

        } catch (error) {

          console.error(
            "حياتي: Service Worker registration failed",
            error
          );

        }

      });

    }
  </script>

</body>

</html>
